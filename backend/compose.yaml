# Local development and test environment: Linux Python 3.12 + PostgreSQL 16.
#
#   docker compose -f backend/compose.yaml up -d db
#   docker compose -f backend/compose.yaml run --rm backend pytest
#   docker compose -f backend/compose.yaml up backend        # http://127.0.0.1:8000/api/health/
#
# Credentials below are for local development only.
name: cofytra-backend

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cofytra
      POSTGRES_USER: cofytra
      POSTGRES_PASSWORD: cofytra-dev-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cofytra -d cofytra"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app/backend
    environment:
      DATABASE_URL: postgresql://cofytra:cofytra-dev-only@db:5432/cofytra
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      # Explicit demo choice: the cofytra_ai service functions are still contract stubs.
      COFYTRA_AI_MODE: mock
      PYTHONPATH: /app
    volumes:
      - ..:/app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
