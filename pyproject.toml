[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "startary"
version = "0.2.0"
description = "Startary AI system — Milestone 1 Startup State Extraction + Diagnosis"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
    "langchain-openai>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.11.0",
]

[project.scripts]
startary-dev = "startary.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["startary*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
markers = [
    "live: marks tests as requiring live LLM API calls (deselect with -m 'not live')",
]
